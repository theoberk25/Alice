    anomaly:
      status: OK
      band: ELEVATED
      score: 0.61
      model: isolation-forest
      factors:
        - "off-hours request (13:42, outside this agent's usual 08:00-11:00 window)"
        - "de-energizing a cooling-plant feed is rare for this agent"
