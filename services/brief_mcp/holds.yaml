    outcome: HOLD
    reason_code: APPROVAL_REQUIRED
    status: HELD
    created_at: "2026-09-06T13:42:07Z"
    biometric_required: true
    context_challenge: {required: false}
    permission:
      outcome: REVIEW_REQUIRED
      rule_ids: [grant-elec-lights-offpeak]
      reason_codes: [APPROVAL_REQUIRED]
      package_generation: 44
