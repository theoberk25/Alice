# Fixture held decisions for the Decision-Brief MCP (BRIEF_SOURCE=mock).
#
# These stand in for authoritative, immutable `alice.decision` records that the
# Pi emits for actions it puts on HOLD (awaiting a human technician). They are
# ILLUSTRATIVE but faithful to the repo's real contracts:
#   * action/target/parameters follow common/schemas/action_request.json
#     (action=set_light_state, target=ESP-LIGHT-01..08, state=on|off)
#   * anomaly.band is one of LOW | ELEVATED | HIGH (dcamr/anomaly_engine/scoring.py)
#     with score in [0,1]
#   * permission.outcome is categorical (PERMITTED | REVIEW_REQUIRED | UNRESOLVED ...)
#     per dcamr/decision_model.py — never a probability
#
# The brief agent READS these and writes a technician-facing brief. It must not
# recompute the decision or invent a verdict. Rename/extend freely — the mock
# source is config-driven so fixtures can be remapped without touching code.
