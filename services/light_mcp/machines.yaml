# Eight-light XIAO ESP32-S3 mapping. Source of truth:
# docs/guides/first-light-hardware.md — verified pin/GPIO/color/channel order and
# the current telemetry presentation roles.
#
#   id      : how agents/tools address the light (rename freely to asset names later)
#   target  : the STABLE signed target ESP-LIGHT-01..08 — keep pinned to preserve
#             the channel/pin/color identity even if you rename `id`
#   label   : verified LED color (identifies the LED, NOT alarm severity)
#   role    : presentation meaning; pattern behavior lives in dcamr/display
#
# States: on = simulated circuit energized, off = disconnected. All boot LOW.
machines:
  - {id: ESP-LIGHT-01, target: ESP-LIGHT-01, label: "Yellow 1", role: "Power draw indicator A",       allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-02, target: ESP-LIGHT-02, label: "Blue 1",   role: "Cooling fan indicator A",      allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-03, target: ESP-LIGHT-03, label: "Red 1",    role: "Server temperature indicator A", allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-04, target: ESP-LIGHT-04, label: "White 1",  role: "Battery 0-50% segment",         allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-05, target: ESP-LIGHT-05, label: "Yellow 2", role: "Power draw indicator B",       allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-06, target: ESP-LIGHT-06, label: "Blue 2",   role: "Cooling fan indicator B",      allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-07, target: ESP-LIGHT-07, label: "Red 2",    role: "Server temperature indicator B", allowed_states: [on, off], default: off}
  - {id: ESP-LIGHT-08, target: ESP-LIGHT-08, label: "White 2",  role: "Battery 50-100% segment",       allowed_states: [on, off], default: off}
