<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .core { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .coreSub { font-size: 12.5px; fill: #cbd5e1; }
      .cardTitle { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .cardWhat { font-size: 12.5px; fill: #334155; }
      .cardWhere { font-size: 12px; font-weight: 600; }
      .tag { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .legend { font-size: 12.5px; fill: #334155; }
      .foot { font-size: 12.5px; fill: #475569; }
      .footHead { font-size: 13px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="900" fill="#f8fafc"/>

  <!-- Header -->
  <text x="40" y="48" class="title">Outbound from Alice — where agent actions go &amp; where they're translated</text>
  <text x="40" y="72" class="sub">Core runs on R2 native structs (no translation). Only the edges re-serialize. Stripe colour = which machine does the translation.</text>

  <!-- CORE -->
  <rect x="40" y="150" width="210" height="540" rx="12" fill="#0f172a"/>
  <text x="145" y="392" class="core" text-anchor="middle">DCAMR CORE</text>
  <text x="145" y="414" class="coreSub" text-anchor="middle">on the Pi</text>
  <text x="145" y="440" class="coreSub" text-anchor="middle">R2 structs · no</text>
  <text x="145" y="456" class="coreSub" text-anchor="middle">translation here</text>
  <text x="145" y="472" class="coreSub" text-anchor="middle">= throughput zone</text>

  <!-- Connectors -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M250,185 H310" marker-end="url(#arrow)"/>
    <path d="M250,265 H310" marker-end="url(#arrow)"/>
    <path d="M250,345 H310" marker-end="url(#arrow)"/>
    <path d="M250,425 H310" marker-end="url(#arrow)"/>
    <path d="M250,505 H310" marker-end="url(#arrow)"/>
    <path d="M250,585 H310" marker-end="url(#arrow)"/>
    <path d="M250,665 H310" marker-end="url(#arrow)"/>
  </g>

  <!-- Card 1: ALLOW -->
  <g>
    <rect x="315" y="152" width="705" height="66" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="315" y="152" width="8" height="66" rx="4" fill="#0e7490"/>
    <text x="338" y="177" class="cardTitle">ALLOW  →  Protected System</text>
    <text x="338" y="197" class="cardWhat">R1 → target-native command  ·  iptables / REST / DNP3 / Modbus / OPC / CLI</text>
    <text x="338" y="212" class="cardWhere" fill="#0e7490">translate on Pi · enforcement gateway</text>
    <rect x="948" y="164" width="58" height="22" rx="11" fill="#0e7490"/>
    <text x="977" y="179" class="tag" text-anchor="middle">T3</text>
  </g>

  <!-- Card 2: REQUEST_CONTEXT -->
  <g>
    <rect x="315" y="232" width="705" height="66" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="315" y="232" width="8" height="66" rx="4" fill="#0e7490"/>
    <text x="338" y="257" class="cardTitle">REQUEST_CONTEXT  →  Agent</text>
    <text x="338" y="277" class="cardWhat">R1 → agent's own JSON  (reverse of T1 ingress adapter)</text>
    <text x="338" y="292" class="cardWhere" fill="#0e7490">translate on Pi · egress adapter</text>
    <rect x="948" y="244" width="58" height="22" rx="11" fill="#0e7490"/>
    <text x="977" y="259" class="tag" text-anchor="middle">T2</text>
  </g>

  <!-- Card 3: DENY -->
  <g>
    <rect x="315" y="312" width="705" height="66" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="315" y="312" width="8" height="66" rx="4" fill="#0e7490"/>
    <text x="338" y="337" class="cardTitle">DENY  →  terminates  (+ notice to agent)</text>
    <text x="338" y="357" class="cardWhat">R1 → agent JSON  (minimal status)  ·  no execution downstream</text>
    <text x="338" y="372" class="cardWhere" fill="#0e7490">translate on Pi</text>
    <rect x="948" y="324" width="58" height="22" rx="11" fill="#0e7490"/>
    <text x="977" y="339" class="tag" text-anchor="middle">T2</text>
  </g>

  <!-- Card 4: HOLD -->
  <g>
    <rect x="315" y="392" width="705" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="315" y="392" width="8" height="66" rx="4" fill="#b45309"/>
    <text x="338" y="417" class="cardTitle">HOLD  →  Technician Workstation (Mac)</text>
    <text x="338" y="437" class="cardWhat">R1 → readable §10 provenance JSON  (for LLM · dashboard · RAW viewer)</text>
    <text x="338" y="452" class="cardWhere" fill="#b45309">translate on Mac · rehydrate from label tables</text>
    <rect x="948" y="404" width="58" height="22" rx="11" fill="#b45309"/>
    <text x="977" y="419" class="tag" text-anchor="middle">T4</text>
  </g>

  <!-- Card 5: Technician return -->
  <g>
    <rect x="315" y="472" width="705" height="66" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <rect x="315" y="472" width="8" height="66" rx="4" fill="#7c3aed"/>
    <text x="338" y="497" class="cardTitle">Technician decision + face result  →  back to Pi</text>
    <text x="338" y="517" class="cardWhat">JSON → R1  (APPROVE ONCE / REJECT + PASS / FAIL)</text>
    <text x="338" y="532" class="cardWhere" fill="#7c3aed">Mac encodes · Pi verifies</text>
    <rect x="948" y="484" width="58" height="22" rx="11" fill="#7c3aed"/>
    <text x="977" y="499" class="tag" text-anchor="middle">T5</text>
  </g>

  <!-- Card 6: Audit -->
  <g>
    <rect x="315" y="552" width="705" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="315" y="552" width="8" height="66" rx="4" fill="#475569"/>
    <text x="338" y="577" class="cardTitle">Every decision  →  Audit drive</text>
    <text x="338" y="597" class="cardWhat">serialize R2 → R1  (sealed · hash-chained · batch-signed)</text>
    <text x="338" y="612" class="cardWhere" fill="#475569">on Pi · serialize only — NOT a semantic translation</text>
    <rect x="948" y="564" width="58" height="22" rx="11" fill="#475569"/>
    <text x="977" y="579" class="tag" text-anchor="middle">T6</text>
  </g>

  <!-- Card 7: Cloud -->
  <g>
    <rect x="315" y="632" width="705" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="315" y="632" width="8" height="66" rx="4" fill="#1d4ed8"/>
    <text x="338" y="657" class="cardTitle">On reconnect  →  Cloud SIEM / EDR</text>
    <text x="338" y="677" class="cardWhat">R1 → OCSF / CEF / cloud JSON  (async · off the hot path)</text>
    <text x="338" y="692" class="cardWhere" fill="#1d4ed8">Pi cloud connector  (or offload to Mac)</text>
    <rect x="941" y="644" width="72" height="22" rx="11" fill="#1d4ed8"/>
    <text x="977" y="659" class="tag" text-anchor="middle">T7/T8</text>
  </g>

  <!-- Legend -->
  <text x="40" y="735" class="footHead">Where the translation runs</text>
  <g>
    <rect x="40" y="748" width="14" height="14" rx="3" fill="#0e7490"/>
    <text x="62" y="760" class="legend">Pi — inside the trust boundary (decision-critical)</text>
    <rect x="360" y="748" width="14" height="14" rx="3" fill="#b45309"/>
    <text x="382" y="760" class="legend">Mac — human / explain edge</text>
    <rect x="640" y="748" width="14" height="14" rx="3" fill="#7c3aed"/>
    <text x="662" y="760" class="legend">Mac encodes · Pi verifies</text>

    <rect x="40" y="772" width="14" height="14" rx="3" fill="#475569"/>
    <text x="62" y="784" class="legend">Serialize only — not a semantic translation</text>
    <rect x="360" y="772" width="14" height="14" rx="3" fill="#1d4ed8"/>
    <text x="382" y="784" class="legend">Cloud export — non-critical (Pi connector or Mac)</text>
  </g>

  <!-- Footer rule -->
  <rect x="40" y="808" width="980" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="830" class="footHead">Governing rule</text>
  <text x="56" y="850" class="foot">Decision-critical + inside the trust boundary  →  translate on the Pi  (T2 challenge · T3 enforce · T6 audit).</text>
  <text x="56" y="867" class="foot">Human-facing  →  translate on the Mac  (T4, keeps the Pi lightweight).   Cloud export (T7/T8) is non-critical — either machine.</text>
</svg>
